site_name: dark-canary
site_description: >-
  Mirror production traffic to a shadow deployment and diff the responses,
  with declarative noise suppression.
repo_url: https://github.com/fabiocicerchia/dark-canary
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
