name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, catches newly disclosed CVEs

permissions:
  pull-requests: read # gitleaks reads PR commits
  contents: read
  security-events: write # upload SARIF to the Security tab

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulns:
    name: filesystem & dependency scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
      - name: Upload SARIF
        # GitHub Advanced Security is required for this on private repos; skip instead of failing red.
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

  govulncheck:
    name: go stdlib & module vulns (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Reachability-based: only reports vulns this code actually calls, so a
      # failure here is always worth acting on. The weekly cron is the point —
      # a new stdlib CVE lands without anyone touching the repo.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  codeql:
    # GitHub Advanced Security is required for this on private repos; skip instead of failing red.
    if: ${{ !github.event.repository.private }}
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/analyze@v4
