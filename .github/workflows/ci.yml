name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Lint and secret scanning live in code-quality.yml and security.yml.
# This workflow runs the tests — without it nothing here proves they pass.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: make test

      # The end-to-end harness: two real services, the real binary, a real
      # proxy in between. Everything else in the suite tests a component in
      # isolation, and the thing they exist to make possible — a shadow
      # mirrored against a primary with the noise suppressed and the one real
      # divergence still visible — is only exercised here. See e2e/README.md.
      - name: End to end
        run: make e2e
