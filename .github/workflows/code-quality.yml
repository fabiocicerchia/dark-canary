name: code-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: build, vet & test (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # go-version-file reads the toolchain directive in go.mod, so the patched
      # stdlib is pinned in exactly one place.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      # -race because the collector pairs requests from concurrent handlers.
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0

  lua:
    name: test (lua capture hook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The hook runs under OpenResty's LuaJIT (5.1); the tests stub ngx and the
      # kit, so any 5.1-compatible interpreter exercises the same logic.
      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377  # v13.0.0
        with:
          luaVersion: "luajit-openresty"
      - name: test
        run: lua lua/dark_canary_test.lua

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # A short run per target: enough to catch a regression a PR just
      # introduced, not a substitute for a long soak. Seed corpora also run as
      # ordinary tests in the job above, so a known crasher fails there first.
      - name: fuzz diff bodies
        run: >-
          go test -run='^$' -fuzz=FuzzDiffBodies -fuzztime=60s
          ./internal/diff/
      - name: fuzz glob matching
        run: >-
          go test -run='^$' -fuzz=FuzzGlobMatching -fuzztime=60s
          ./internal/noise/
      # Whatever input broke it is the only useful artifact of a failed run.
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-corpus
          path: internal/*/testdata/fuzz/

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Lint the GitHub Actions workflows themselves.
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

      # Enforce .editorconfig (indentation, EOL, trailing whitespace).
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@d2ed4fd072ae6f887e9407c909af0f585d2ad9f4  # v2

      # Catch common typos in code and docs.
      - name: typos
        uses: crate-ci/typos@4d9c206a77c041268485162b8e2579ad7a5cb9a3  # branch master

      # pre-commit runs the language-specific hooks defined in
      # .pre-commit-config.yaml. It no-ops gracefully if none apply.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
